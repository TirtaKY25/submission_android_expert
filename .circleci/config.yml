version: 2.1

orbs:
  android: circleci/android@0.2.1

executors:
  android-executor:
    docker:
      - image: cimg/android:2023.10.1
    resource_class: large
    environment:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  build:
    executor: android-executor
    steps:
      - checkout
      
      - run:
          name: Install Gradle 8.6
          command: |
            curl -s "https://get.sdkman.io" | bash
            source "$HOME/.sdkman/bin/sdkman-init.sh"
            sdk install gradle 8.6

      - restore_cache:
          key: android-orb-v1-{{ checksum "build.gradle" }}

      - run:
          name: Chmod permissions
          command: sudo chmod +x ./gradlew

      - run:
          name: Set JAVA_HOME
          command: export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64

      - run:
          name: Download Dependencies
          command: ./gradlew androidDependencies --warning-mode=all --stacktrace --info

      - save_cache:
          key: android-orb-v1-{{ epoch }}
          paths:
            - ~/.android/build-cache
            - ~/.android/cache

      - run:
          name: Run Build
          command: ./gradlew build --stacktrace --info

      - store_artifacts:
          path: app/build/reports
          destination: reports

      - run:
          name: Run Tests
          command: ./gradlew lint test --stacktrace

      - store_test_results:
          path: app/build/test-results

      - store_artifacts:
          path: app/build/outputs/apk/debug/
          destination: artifact-file
